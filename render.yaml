# Render Blueprint for the Express backend.
# Deploy: create a new Blueprint on Render pointing at this repo.
services:
  - type: web
    name: jade-portfolio-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_ORIGIN
        sync: false # set to your deployed frontend URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO
        value: jesryljade18@gmail.com
